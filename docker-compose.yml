services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data:ro
      - ./scripts:/scripts:ro
      - ./piper_voices:/models/piper
      - hf_cache:/root/.cache/huggingface
      - audio_storage:/app/storage/audio
    environment:
      - HF_HOME=/root/.cache/huggingface
      - PIPER_VOICE_DIR=/models/piper
      - AUDIO_DIR=/app/storage/audio
      - DATABASE_URL=sqlite:////app/storage/narrator.db
      - DATA_DIR=/data
      - RUNTIME_MODE=local
      - LOAD_MODELS_ON_STARTUP=${LOAD_MODELS_ON_STARTUP:-1}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - API_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  hf_cache:
  audio_storage:
